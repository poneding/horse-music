apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: horse-music-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horse-music
  labels:
    app.kubernetes.io/name: horse-music
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: horse-music
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horse-music
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: aliyun-registry
      containers:
        - name: music
          image: registry.cn-hangzhou.aliyuncs.com/pding/music:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          env:
            - name: PORT
              value: "4173"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: music-admin
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-admin
                  key: ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/state
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/state
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/state
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: music-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: music-data
          persistentVolumeClaim:
            claimName: horse-music-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: horse-music
  labels:
    app.kubernetes.io/name: horse-music
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: horse-music
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
